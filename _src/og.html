<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'Manrope';
      font-weight: 500 800;
      src: url(../fonts/manrope-cyrillic.woff2) format('woff2');
      unicode-range: U+0400-045F;
    }

    @font-face {
      font-family: 'Manrope';
      font-weight: 500 800;
      src: url(../fonts/manrope-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F;
    }

    @font-face {
      font-family: 'Unbounded';
      font-weight: 500 700;
      src: url(../fonts/unbounded-cyrillic.woff2) format('woff2');
      unicode-range: U+0400-045F;
    }

    @font-face {
      font-family: 'Unbounded';
      font-weight: 500 700;
      src: url(../fonts/unbounded-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+2000-206F;
    }

    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(circle at 100% 0%, rgba(150, 90, 255, .36), transparent 45%), radial-gradient(circle at 0% 100%, rgba(255, 140, 60, .2), transparent 45%), linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px) 0 0 / 60px 60px, linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px) 0 0 / 60px 60px, #0e0716;
      color: #fff4fb;
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 72px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .badge {
      align-self: flex-start;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .16);
      font-size: 22px;
      font-weight: 700;
      color: #ff4fa3;
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 46px;
      line-height: 1.08;
      font-weight: 600;
    }

    h1 b {
      font-weight: inherit;
      white-space: nowrap;
    }

    h1 span {
      background: linear-gradient(100deg, #ffa94d 0%, #ff4fa3 48%, #b685ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: 25px;
      font-weight: 500;
      color: #b39bc4;
    }

    img {
      width: 380px;
      height: 380px;
      object-fit: cover;
      object-position: center top;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, .16);
    }
  </style>
</head>

<body>
  <main>
    <div class="badge">AI-first разработчик</div>
    <h1>Запускаю <b>веб-продукты</b><br>вместе с <span><b>ИИ-агентами</b></span></h1>
    <p>Павел Искринский · 7 продуктов за 2 месяца</p>
  </main>
  <picture>
    <img src="../img/me-800.jpg" alt="" />
  </picture>
</body>

</html>
