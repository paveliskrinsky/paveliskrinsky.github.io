<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(circle at 0% 0%, rgba(139, 123, 255, .35), transparent 45%), radial-gradient(circle at 100% 100%, rgba(47, 224, 192, .18), transparent 45%), #0f1117;
      color: #eef0f6;
      font-family: 'Manrope', sans-serif;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 72px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .badge {
      align-self: flex-start;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .16);
      font-size: 22px;
      font-weight: 700;
      color: #9097ab;
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 64px;
      line-height: 1.08;
      font-weight: 600;
    }

    h1 span {
      background: linear-gradient(110deg, #8b7bff 0%, #2fe0c0 60%, #ff8a5c 120%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: 28px;
      font-weight: 500;
      color: #9097ab;
    }

    img {
      width: 340px;
      height: 454px;
      object-fit: cover;
      object-position: center top;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, .16);
    }
  </style>
</head>

<body>
  <main>
    <div class="badge">paveliskrinsky.github.io</div>
    <h1>Павел Искринский<br><span>фронтенд-разработчик</span></h1>
    <p>Быстрые сайты по Figma · 14 лет опыта</p>
  </main>
  <picture>
    <img src="../img/avatar-800.jpg" alt="" />
  </picture>
</body>

</html>
